# Set the new prefix to Ctrl+G
set -g prefix C-g

# Bind Ctrl+G to send-prefix
bind-key C-g send-prefix

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable extended keys support for Ctrl+Shift combinations
set -g extended-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'alacritty:extkeys'

# Allow passthrough for bracketed paste
set -g allow-passthrough on
set -s set-clipboard on

# Start countint panes from 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Custom split commands
bind-key i split-window -h -c "#{pane_current_path}"
bind-key o split-window -v -c "#{pane_current_path}"


# Status bar background color
set -g status-style bg=default

# Adjust left section of status bar
set -g status-left " "

# Adjust right section of status bar
set -g status-right ""

# Change tab information
set -g window-status-format "#[fg=red]#I #{b:pane_current_path}"
set -g window-status-current-format "#[fg=green]> #{b:pane_current_path}"
set -g automatic-rename on


# Hook to set window title based on current working directory


# Navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Swap pane positions with Shift+J/K/L/H in command mode
bind-key -T prefix J swap-pane -D
bind-key -T prefix K swap-pane -U
bind-key -T prefix L swap-pane -t :.+
bind-key -T prefix H swap-pane -t :.-

# Resize panes with prefix + hjkl (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
