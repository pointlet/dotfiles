[values]
# Typography & spacing
FONT = "IBM Plex Mono SemiBold"
FONT_SIZE = 13
PADDING = 4

# Layout basics
BAR_HEIGHT = 24
BORDER_WIDTH = 4
OUTER_GAP = 8
INNER_GAP = 8

# Core palette (shared by all apps)
BACKGROUND = "#e6e2e1"
SURFACE = "#ced2db"
FOREGROUND = "#3b3936"
MUTED = "#8d8c84"
ACCENT = "#596369"
ACCENT_SOFT = "#83909a"
BORDER = "#4b4f4d"
DANGER = "#d13b3b"
DANGER_SOFT = "#f2b8b8"
TRANSPARENT = "#00000000"

# Clock & wallpaper
CLOCK_FORMAT = "%H:%M %a %d/%m"
WALLPAPER_PATH = "/home/pointlet/images/wallpaper.jpg"
WALLPAPER_MODE = "fill"
